include:
  - project: 'kmohrf/gitlabfilet'
    ref: 'v2.1.0'
    file:
      - '/templates/deb.gitlab-ci.yml'
      - '/templates/python.gitlab-ci.yml'

stages:
  - test
  - build

variables:
  GITLABFILET_IMAGE: git-registry.hack-hro.de:443/kmohrf/docker-recipes/debbuild-python:trixie
  NO_UPDATE_TOX: 1

lint::python-types:
  image: node:lts-bookworm-slim
  stage: test
  tags:
    - fast-io
  before_script:
    - apt update && apt install -y wget make python3-flask python3-flask-mail python3-html2text python3-jinja2 python3-sentry-sdk python3-uwsgidecorators
  script:
    - make lint-python-pyright

test::python:
  before_script:
    - printf "\n127.0.0.1 gitlab.localhost\n" >>/etc/hosts
